  <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.72;.8;1" dur="3.2s" begin="0.0s" repeatCount="indefinite"/>
</text><text x="440.0" y="338" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#C9C4FF" letter-spacing=".5">no SIM · no data plan · free</text>
